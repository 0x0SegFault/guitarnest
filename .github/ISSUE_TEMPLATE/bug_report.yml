name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GuitarNest! **Please never attach audio files you do not own** or full copyrighted tabs. Describe the problem instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
  - type: input
    id: version
    attributes:
      label: GuitarNest version
      description: Settings → About, or your app store.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, GrapheneOS (Android 15)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install GuitarNest from?
      options: [F-Droid, IzzyOnDroid, GitHub release, Obtainium, Built from source]
