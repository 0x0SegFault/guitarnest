name: Research

on:
  push:
    branches: [main]
    paths: ["research/**", ".github/workflows/research.yml"]
  pull_request:
    paths: ["research/**", ".github/workflows/research.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcription:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/transcription
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ./fetch_model.sh
      - name: Accuracy on the test pieces
        run: python evaluate.py | tee -a "$GITHUB_STEP_SUMMARY"
