name: iOS

# Runs only when something the iOS app uses changes.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - "app/src/main/res/values*/strings.xml"
      - "scripts/ios_strings.py"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - "app/src/main/res/values*/strings.xml"
      - "scripts/ios_strings.py"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel older runs only on pull requests: a cancelled run on main shows as failing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: cd ios && swiftlint lint --strict --reporter github-actions-logging
      - name: Shared Kotlin framework
        run: |
          set -o pipefail
          ./gradlew :shared:assembleGuitarNestSharedReleaseXCFramework 2>&1 | tee gradle-ios.log
      - name: Translations from the Android strings
        run: python3 scripts/ios_strings.py
      - name: Xcode project
        run: cd ios && xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' in runtime:
                  phones = [d for d in devices[runtime] if d['name'].startswith('iPhone')]
                  # The App Store requires 6.9-inch screenshots: prefer a Pro Max.
                  phones.sort(key=lambda d: 'Pro Max' not in d['name'])
                  if phones:
                      print(phones[0]['udid']); break
          ")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$SIM"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project ios/GuitarNest.xcodeproj -scheme GuitarNest -destination "id=$SIM" \
            -derivedDataPath build/ios 2>&1 | tee ios-build.log | grep -E "error:|warning: |Test Case .* (passed|failed)|\*\* (BUILD|TEST)"
      - name: Simulator screenshots
        run: |
          mkdir -p screenshots
          xcrun simctl boot "$SIM" 2>/dev/null || true
          APP=$(find build/ios/Build/Products -path "*iphonesimulator*" -name "GuitarNest.app" | head -1)
          xcrun simctl install "$SIM" "$APP"
          shot() { sleep 8; xcrun simctl io "$SIM" screenshot "screenshots/$1.png"; xcrun simctl terminate "$SIM" io.github.x0x0segfault.guitarnest || true; }
          APPID=io.github.x0x0segfault.guitarnest
          xcrun simctl launch "$SIM" $APPID --demo; shot 1-library
          xcrun simctl launch "$SIM" $APPID --demo --open-example --play; shot 2-play-along
          xcrun simctl launch "$SIM" $APPID --demo --tab metronome --play; shot 3-metronome
          xcrun simctl launch "$SIM" $APPID --demo --tab tuner --demo-hz 110.1; shot 4-tuner
          xcrun simctl launch "$SIM" $APPID --demo --tab listen; shot 5-tab-from-audio
          xcrun simctl launch "$SIM" $APPID --demo -AppleLanguages "(fr)" -AppleLocale fr_FR; shot 6-library-fr
      - name: Keep the build log and screenshots with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-preview
          path: |
            ios-build.log
            gradle-ios.log
            screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
