name: Release

# Push a tag like v1.0.0 to build, sign and publish guitarnest-1.0.0.apk.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > guitarnest-release.jks
          printf 'storeFile=guitarnest-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build
        run: ./gradlew :shared:jvmTest testDebugUnitTest assembleRelease bundleRelease

      - name: Verify the APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $BT/apksigner verify --print-certs "$APK" | grep "SHA-256"
          # Permissions must match PRIVACY.md (same list as build.yml).
          $BT/aapt2 dump permissions "$APK" | sed -n "s/^uses-permission: name='\(.*\)'/\1/p" | sed 's/^io.github.x0x0segfault.guitarnest\.//' | sort > found.txt
          printf '%s\n' DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION \
            android.permission.INTERNET android.permission.RECORD_AUDIO | sort > allowed.txt
          diff allowed.txt found.txt
          cp "$APK" "guitarnest-$VERSION.apk"
          sha256sum "guitarnest-$VERSION.apk" > "guitarnest-$VERSION.apk.sha256"
          # App Bundle for Google Play (signed with the same key; not for direct install).
          cp app/build/outputs/bundle/release/app-release.aab "guitarnest-$VERSION.aab"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=fastlane/metadata/android/en-US/changelogs/$CODE.txt
          gh release create "$GITHUB_REF_NAME" "guitarnest-$VERSION.apk" "guitarnest-$VERSION.apk.sha256" "guitarnest-$VERSION.aab" \
            --title "GuitarNest $VERSION" --notes-file "$NOTES" --verify-tag

      - name: Remove the signing key
        if: always()
        run: rm -f guitarnest-release.jks keystore.properties
